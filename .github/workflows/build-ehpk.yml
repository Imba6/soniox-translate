name: Build Even G2 package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/translation-modes
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Package Even Hub app
        run: npx --no-install evenhub pack app.json dist -o soniox-translate.ehpk
      - name: Upload downloadable EHPK
        uses: actions/upload-artifact@v4
        with:
          name: soniox-translate-g2
          path: soniox-translate.ehpk
          if-no-files-found: error
          retention-days: 30
